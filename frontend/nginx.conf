# React Router uses client-side routing -- without this fallback, a
# direct browser visit (or refresh) on e.g. /clients/5 would hit nginx
# looking for a literal /clients/5 file/folder and 404, since only
# index.html and the built JS actually know how to render that route.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
