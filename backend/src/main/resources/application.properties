spring.application.name=backend

# Local Postgres instance (not running yet — provisioned in a later module)
spring.datasource.url=jdbc:postgresql://localhost:5432/clientos
spring.datasource.username=postgres
spring.datasource.password=postgres

# Migrations live at the repo root (database/migrations), not inside the backend module,
# so both the Java backend and the AI service can reference the same schema history.
spring.flyway.locations=filesystem:../database/migrations

# Flyway owns the schema — Hibernate must never create/alter tables itself.
# "validate" only checks that entities match what Flyway already created.
spring.jpa.hibernate.ddl-auto=validate

# Disables Open Session in View: without this, Hibernate keeps a DB session open
# for the entire request (even during view rendering), which hides N+1 query bugs
# and leaks the persistence layer past the service boundary.
spring.jpa.open-in-view=false

# JWT signing secret (256-bit, base64) and token lifetime (1 hour).
# For a real deployment this belongs in an environment variable, not a committed
# file — kept here for now to match "keep the architecture simple" for this module.
jwt.secret=2VFFQ9JhgdMPSpYsBmjslZvhE+XzuPOkFDmcOSe+3kk=
jwt.expiration-ms=3600000
