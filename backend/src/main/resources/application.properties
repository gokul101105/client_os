spring.application.name=backend

# Module 18: every value below is overridable via an environment variable
# (Spring's standard ${VAR:default} placeholder syntax), with the
# original hardcoded value kept as the default -- local, non-Docker dev
# (`./mvnw spring-boot:run`) behaves exactly as before with zero env vars
# set. docker-compose.yml supplies real values for containerized runs.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clientos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Migrations live at the repo root (database/migrations) on a local checkout,
# but inside the Docker image they're copied to an absolute path instead
# (see backend/Dockerfile) -- SPRING_FLYWAY_LOCATIONS overrides this there.
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:filesystem:../database/migrations}

# Flyway owns the schema — Hibernate must never create/alter tables itself.
# "validate" only checks that entities match what Flyway already created.
spring.jpa.hibernate.ddl-auto=validate

# Disables Open Session in View: without this, Hibernate keeps a DB session open
# for the entire request (even during view rendering), which hides N+1 query bugs
# and leaks the persistence layer past the service boundary.
spring.jpa.open-in-view=false

# JWT signing secret (256-bit, base64) and token lifetime (1 hour).
# Module 18: overridable via JWT_SECRET -- docker-compose.yml requires it
# to be set explicitly (${JWT_SECRET:?...}) rather than silently falling
# back to this committed dev-only value in any real deployment.
jwt.secret=${JWT_SECRET:2VFFQ9JhgdMPSpYsBmjslZvhE+XzuPOkFDmcOSe+3kk=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Document uploads (Module 7). Enforced at the container level as the first
# line of defense — an oversized upload is rejected before DocumentService's
# own size check ever runs.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Local disk storage root for uploaded documents. Relative to the backend
# module's working directory locally; a shared Docker volume mounted at
# /app/storage/documents in containerized runs (see docker-compose.yml)
# so the ai-service container can read the same files.
app.storage.base-dir=${APP_STORAGE_BASE_DIR:./storage/documents}

# AI service integration (Module 12). internal-api-key must match the AI
# service's own INTERNAL_API_KEY (see ai-service/.env.example, Module 8).
# timeout-seconds is generous on purpose — a RAG + Claude call can
# legitimately take several seconds. In Docker, base-url points at the
# ai-service container by its service name, not localhost.
ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai-service.internal-api-key=${AI_SERVICE_INTERNAL_API_KEY:dev-internal-key}
ai-service.timeout-seconds=${AI_SERVICE_TIMEOUT_SECONDS:30}
